name: Generate Profile Assets

on:
  schedule:
    - cron: "0 3 * * *"    # refreshes once a day at 3am UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make assets folder
        run: mkdir -p assets

      - name: Generate banner (capsule-render, saved as a static file)
        run: |
          for i in 1 2 3; do
            curl -sSL "https://capsule-render.vercel.app/api?type=waving&color=0:0F2027,50:203A43,100:2C5364&height=250&section=header&text=Mahad%20Munir&fontSize=70&fontColor=ffffff&animation=fadeIn&fontAlignY=35&desc=DevOps%20Engineer%20%7C%20AWS%20Certified%20%7C%20Kubernetes%20and%20AI&descAlignY=55&descSize=20" -o assets/banner.svg
            if grep -q "<svg" assets/banner.svg; then echo "banner OK"; break; fi
            echo "attempt $i failed, retrying in 10s..."; sleep 10
          done
          grep -q "<svg" assets/banner.svg || (echo "::error::banner.svg is not valid SVG after 3 attempts" && cat assets/banner.svg && exit 1)
          # sanity check: make sure no unescaped & survived into the SVG text nodes
          if grep -P '(?<!amp;)(?<!lt;)(?<!gt;)&(?!amp;|lt;|gt;|#)' assets/banner.svg | grep -q .; then
            echo "::error::banner.svg contains an unescaped & character (invalid XML)"; cat assets/banner.svg; exit 1
          fi

      - name: Generate footer banner
        run: |
          for i in 1 2 3; do
            curl -sSL "https://capsule-render.vercel.app/api?type=waving&color=0:2C5364,50:203A43,100:0F2027&height=150&section=footer" -o assets/footer.svg
            if grep -q "<svg" assets/footer.svg; then echo "footer OK"; break; fi
            echo "attempt $i failed, retrying in 10s..."; sleep 10
          done
          grep -q "<svg" assets/footer.svg || (echo "::error::footer.svg is not valid SVG after 3 attempts" && cat assets/footer.svg && exit 1)

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=MMahad3&show_icons=true&theme=dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=39FF14&text_color=c9d1d9&count_private=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=MMahad3&layout=compact&theme=dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=c9d1d9
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy case
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MMahad3
          output_path: assets/trophy.svg
          theme: darkhub
          token: ${{ secrets.TROPHY_TOKEN }}   # needs a PAT with read:user + public_repo, not the default GITHUB_TOKEN

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update profile assets" && git push)
